seed: 42
device: auto
output_dir: outputs/tcr_paper/full

data:
  source: station_jsonl
  data_dir: data/mock_station_v1
  train_samples: 4096
  val_samples: 1024
  test_samples: 1024
  train_normal_only: false
  anomaly_ratio: 0.45
  batch_size: 64
  num_workers: 0
  sequence_length: 16
  history_length: 12
  state_dim: 6
  context_dim: 6
  control_param_dim: 2
  time_feature_dim: 2
  history_feature_dim: 8
  num_intents: 6
  num_objects: 4
  num_sources: 3
  num_modes: 4

paper_model:
  d_model: 96
  nhead: 4
  ffn_dim: 256
  shared_layers: 2
  sequence_layers: 2
  dropout: 0.10
  use_transformer: true
  use_cross_attention: true
  max_history_length: 32
  intent_embed_dim: 16
  object_embed_dim: 12
  source_embed_dim: 12
  obs_dim: 5
  lambda_sigma: 0.01
  cov_epsilon: 0.0001

paper_train:
  epochs: 24
  lr: 0.0008
  weight_decay: 0.0001
  grad_clip_norm: 5.0
  log_interval: 20
  prototype_momentum: 0.95
  early_stop_patience: 8

paper_loss:
  lambda_pred: 0.20
  lambda_seq: 0.20
  lambda_cls: 1.00
  lambda_reg: 0.000001
  class_weights: [1.0, 1.2, 1.5]

paper_score:
  stats_epsilon: 1.0e-6
  thresholds:
    mode: grid_search
    eta1_quantiles: [0.55, 0.60, 0.65, 0.70, 0.75]
    eta2_quantiles: [0.70, 0.75, 0.80, 0.85, 0.90, 0.95]
  component_weight_grid:
    - [0.34, 0.33, 0.33]
    - [0.50, 0.25, 0.25]
    - [0.25, 0.50, 0.25]
    - [0.25, 0.25, 0.50]
    - [0.40, 0.30, 0.30]
    - [0.30, 0.40, 0.30]
    - [0.30, 0.30, 0.40]
  hybrid_mix_grid: [0.5]

paper_rules:
  allowed_types:
    - [0]
    - [1]
    - [2]
    - [3]
    - [4]
    - [5]
  allowed_dst:
    - [0]
    - [2]
    - [2]
    - [0]
    - [3]
    - [1]
  allowed_role:
    - [0]
    - [0]
    - [0]
    - [1]
    - [1]
    - [2]
  allowed_time_windows:
    - [0, 23]
    - [6, 22]
    - [6, 22]
    - [8, 18]
    - [8, 20]
    - [0, 23]
  size_bounds:
    - [20.0, 220.0]
    - [25.0, 240.0]
    - [20.0, 200.0]
    - [10.0, 140.0]
    - [8.0, 110.0]
    - [15.0, 180.0]
  depth_max: [2.0, 2.0, 2.0, 1.0, 1.0, 2.0]
  size_violation_gate: 0.20

baseline:
  svdd_latent_dim: 32
  svdd_lr: 0.001
  svdd_epochs: 20
  dagmm_latent_dim: 8
  dagmm_hidden_dim: 64
  dagmm_n_gmm: 3
  dagmm_lr: 0.001
  dagmm_epochs: 20
  dagmm_lambda_energy: 0.1
  dagmm_lambda_cov: 0.005
  ocnn_hidden_dim: 64
  ocnn_lr: 0.001
  ocnn_epochs: 20
